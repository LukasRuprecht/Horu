[project]
name = "horu"
version = "0.1.0"
description = "A Japanese study buddy for video games: capture on-screen text, look it up, and get explanations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Lukas Ruprecht" }]
keywords = ["japanese", "language-learning", "ocr", "games", "furigana", "anki"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "anthropic>=1.11.0",
    "fastanki>=0.0.6",
    "fsrs>=6.3.2",
    "keyring>=25.7.0",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "rapidocr>=3.9.2",
    "sudachidict-full>=20260723",
    "sudachipy>=0.7.0",
    "websockets>=16.0",
]

[project.urls]
Repository = "https://github.com/LukasRuprecht/Horu"
Issues = "https://github.com/LukasRuprecht/Horu/issues"

[project.scripts]
horu = "horu.cli:main"

[project.gui-scripts]
horu-app = "horu.cli:gui"

[project.optional-dependencies]
manga-ocr = [
    "manga-ocr>=0.1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
