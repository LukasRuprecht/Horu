[project]
name = "horu"
version = "0.1.0"
description = "A Japanese study buddy for video games: capture on-screen text, look it up, and get explanations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "manga-ocr>=0.1.16",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
]

[project.scripts]
horu = "horu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
