[project]
name = "horu"
version = "0.1.0"
description = "A Japanese study buddy for video games: capture on-screen text, look it up, and get explanations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fugashi>=1.5.2",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "rapidocr>=3.9.2",
    "unidic-lite>=1.0.8",
]

[project.scripts]
horu = "horu.cli:main"

[project.optional-dependencies]
manga-ocr = [
    "manga-ocr>=0.1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
