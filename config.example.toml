# Horu configuration.
# On first run this file is copied to config.toml (gitignored). Edit config.toml, not this file.

[hotkeys]
# Modifiers in angle brackets, e.g. "<ctrl>+<alt>+j", "<f9>", "<ctrl>+<shift>+<space>".
capture = "<ctrl>+<alt>+j"

[capture]
# "window":  the focused window, i.e. your game. No setup needed. (Windows only; elsewhere
#            falls back to "monitor".)
# "monitor": a whole monitor. Run `uv run horu monitors` to list them.
# "region":  a fixed box, for capture-card previews or to ignore the rest of the screen.
mode = "window"
monitor = 1
# Only used when mode = "region". Physical pixels relative to the monitor's top-left corner.
# region = { left = 370, top = 1050, width = 1820, height = 300 }

[ocr]
# "rapidocr":  finds every line of text on screen, then reads it (PP-OCRv5). Recommended.
# "manga_ocr": reads one block of text; only useful with a tight capture region.
engine = "rapidocr"

[debug]
# Save every capture as a PNG, handy when OCR misreads something.
save_captures = false
captures_dir = "captures"

[ai]
# Optional: AI translations and explanations. Dictionary lookups work without it.
# Horu never ships API keys: put yours in .env (copy .env.example).
#
# "none":          AI features off.
# "anthropic":     Claude. Key: ANTHROPIC_API_KEY in .env.
# "openai_compat": anything that speaks the OpenAI API (set base_url and api_key_env):
#   OpenAI:  base_url = "https://api.openai.com/v1", api_key_env = "OPENAI_API_KEY"
#   Gemini:  base_url = "https://generativelanguage.googleapis.com/v1beta/openai/",
#            api_key_env = "GEMINI_API_KEY"
#   Ollama (free, runs locally): base_url = "http://localhost:11434/v1", no key needed,
#            model e.g. "qwen3:8b" (run `ollama pull qwen3:8b` first)
provider = "none"
model = "claude-opus-5-5"
# base_url = ""
# api_key_env = ""
