# Builds the Windows installer when a version tag (v0.1.0) is pushed, and attaches it to a
# draft release to check and publish by hand. Also runnable from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Tests
        run: uv run --frozen pytest -q
      - name: Build
        shell: pwsh
        run: powershell -ExecutionPolicy ByPass -File packaging\build.ps1
      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem dist\Horu-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Horu-Setup
          path: dist/Horu-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            dist/Horu-Setup-*.exe
            dist/SHA256SUMS.txt
