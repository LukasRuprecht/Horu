<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horu</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Horu</div>
    <div id="status" class="status loading" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Starting...</span>
    </div>
    <div class="actions">
      <button id="toggle-furigana" class="toggle" type="button" aria-pressed="true" title="Furigana">
        <ruby>漢<rt>かん</rt></ruby>
      </button>
      <button id="toggle-screen" class="toggle" type="button" aria-pressed="true" title="Show other screen text (menus, HUD)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button id="toggle-top" class="toggle" type="button" aria-pressed="false" title="Keep window on top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v8"/></svg>
      </button>
      <button id="clear" class="icon" type="button" title="Clear history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>
  </header>

  <main id="lines">
    <div id="empty" class="empty">
      <p class="empty-title">No text yet</p>
      <p>Switch to your game and press the capture hotkey. Each line shows up here; click any word to look it up.</p>
      <p class="credit">Dictionary: JMdict by the EDRDG, CC BY-SA 4.0</p>
    </div>
  </main>

  <div id="popover" class="popover" role="dialog" hidden></div>

  <script src="app.js"></script>
</body>
</html>
