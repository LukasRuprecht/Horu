<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horu</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Horu</div>
    <div id="status" class="status loading" role="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">Starting...</span>
    </div>
    <div class="actions">
      <button id="toggle-furigana" class="toggle" type="button" aria-pressed="true" title="Furigana">
        <ruby>漢<rt>かん</rt></ruby>
      </button>
      <button id="toggle-screen" class="toggle" type="button" aria-pressed="true" title="Show other screen text (menus, HUD)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      </button>
      <button id="toggle-top" class="toggle" type="button" aria-pressed="false" title="Keep window on top">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v8"/></svg>
      </button>
      <button id="clear" class="icon" type="button" title="Clear history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
      <button id="open-settings" class="toggle" type="button" aria-pressed="false" aria-controls="settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <section id="settings" class="settings" aria-label="Settings" hidden>
    <h2>Display</h2>
    <label class="setting">
      <span>Text size</span>
      <input id="text-size" type="range" min="16" max="48" step="1">
      <output id="text-size-value" for="text-size"></output>
    </label>
    <label class="setting">
      <span>Furigana size</span>
      <input id="furigana-scale" type="range" min="0.4" max="0.8" step="0.05">
      <output id="furigana-scale-value" for="furigana-scale"></output>
    </label>
    <div class="preview text" lang="ja" aria-hidden="true">
      <ruby>日本語<rt>にほんご</rt></ruby>を<ruby>読<rt>よ</rt></ruby>む
    </div>
    <div class="settings-actions">
      <button id="reset-display" type="button">Reset to defaults</button>
    </div>

    <h2>AI</h2>
    <p id="ai-status" class="ai-status"></p>
    <div id="ai-options">
      <label class="check"><input id="auto-translate" type="checkbox"> Translate new dialogue automatically</label>
      <label class="check"><input id="blur-translations" type="checkbox"> Blur translations until clicked</label>
      <label class="setting-text">
        <span>Your level (explanations are pitched to this)</span>
        <input id="learner-level" type="text" placeholder="e.g. Beginner (studying with Genki I)">
      </label>
    </div>
  </section>

  <main id="lines">
    <div id="empty" class="empty">
      <p class="empty-title">No text yet</p>
      <p>Switch to your game and press the capture hotkey. Each line shows up here; click any word to look it up.</p>
      <p class="credit">Dictionary: JMdict by the EDRDG, CC BY-SA 4.0</p>
    </div>
  </main>

  <section id="tutor" class="tutor" aria-label="Tutor" hidden>
    <header class="tutor-head">
      <div id="tutor-title" class="tutor-title" lang="ja"></div>
      <button id="tutor-close" class="pop-close" type="button" title="Close">×</button>
    </header>
    <div id="tutor-log" class="tutor-log" lang="ja"></div>
    <form id="tutor-form" class="tutor-form">
      <input id="tutor-input" type="text" placeholder="Ask a follow-up, e.g. why は and not が here?" autocomplete="off">
      <button id="tutor-send" type="submit">Ask</button>
    </form>
  </section>

  <div id="popover" class="popover" role="dialog" hidden></div>

  <script src="app.js"></script>
</body>
</html>
